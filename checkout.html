<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | CraftedByMoharana</title>
    <link rel="icon" type="image/png" href="images/logo-icon.png">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="checkout.css">
</head>
<body>

    <a href="index.html" class="back-link">← Back to Shop</a>

    <div class="container">

        <!-- Shipping Form -->
        <div class="card">
            <h2>Shipping Details / ପଠାଇବା ଠିକଣା</h2>

            <form id="checkoutForm" onsubmit="handleOrder(event)">
                <div class="form-group">
                    <label>Full Name / ନାମ</label>
                    <input type="text" id="custName" required placeholder="Ex: Radheysyam Satpathy">
                </div>

                <div class="form-group">
                    <label>Email ID / ଇମେଲ୍</label>
                    <input type="email" required placeholder="Radheysyam@gmail.com">
                </div>

                <div class="form-group">
                    <label>Phone / ଫୋନ୍ ନମ୍ବର</label>
                    <input type="tel" id="custPhone" required placeholder="+91 9876543210">
                </div>

                <div class="form-group">
                    <label>Address / ଠିକଣା</label>
                    <textarea id="custAddress" rows="3" required placeholder="Street, City, Pin Code"></textarea>
                </div>

                <button type="submit" class="place-order-btn">
                    Confirm Order (COD)
                </button>
            </form>
        </div>

        <!-- Order Summary -->
        <div class="card">
            <h2>Order Summary</h2>

            <div id="orderItems"></div>

            <div class="total-section">
                <span>Grand Total:</span>
                <span id="grandTotal">₹0</span>
            </div>

            <p style="margin-top: 1rem; font-size: 0.9rem; color: #666;">
                * Currently supporting Cash on Delivery or UPI upon confirmation call.
            </p>
        </div>

    </div>

    <!-- External JavaScript -->
    <script src="checkout.js"></script>

</body>
</html>
